services:

  app:
    build: .
    container_name: ${APP_NAME:-fitpower}_app
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: mi_base_de_datos
      DB_USER: usuario
      DB_PASS: password
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: ${APP_NAME:-fitpower}_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: mi_base_de_datos
      MYSQL_USER: usuario
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
      - ./api/config/init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ${APP_NAME:-fitpower}_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
