PassEnv DB_HOST DB_NAME DB_USER DB_PASS
ServerName localhost

<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex front/index.html index.html
</Directory>

<Directory /var/www/html/api>
    AllowOverride All
    Require all granted
    FallbackResource /api/index.php
</Directory>
